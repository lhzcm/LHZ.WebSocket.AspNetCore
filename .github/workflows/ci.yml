name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore src/LHZ.WebSocket.AspNetCore.slnx

      - name: Build
        run: dotnet build src/LHZ.WebSocket.AspNetCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/LHZ.WebSocket.AspNetCore.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/LHZ.WebSocket.AspNetCore/LHZ.WebSocket.AspNetCore.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
